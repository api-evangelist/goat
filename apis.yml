name: GOAT
description: GOAT (operated by GOAT Group) is a global online marketplace for authentic sneakers,
  apparel, and accessories, launched in 2015 and headquartered in the Los Angeles area. The platform
  pairs a consumer buying-and-selling experience with in-house authentication that verifies new and
  used footwear and streetwear from thousands of brands, and GOAT Group also operates the Flight Club
  consignment stores and the alias seller platform. GOAT was surfaced as a portfolio company of a16z,
  accel, index-ventures, initialized-capital, matrix-partners, and sv-angel and added to the API
  Evangelist network as a venture-backed company profile. It runs a consumer commerce platform rather
  than a public developer API, so this enriched profile focuses on verified company identity and the
  security surface probed from its public domain.
